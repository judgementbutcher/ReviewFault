name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: apps/android
      - run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk ReviewFault-android-v0.2.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ReviewFault-android-v0.2.1-debug.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild apps/windows/ReviewFault/ReviewFault.csproj -restore -p:Platform=x64 -p:Configuration=Release
      - shell: pwsh
        run: Compress-Archive -Path apps/windows/ReviewFault/bin/x64/Release/* -DestinationPath ReviewFault-windows-v0.2.1-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ReviewFault-windows-v0.2.1-x64.zip

  publish:
    needs: [core, android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
      - run: sha256sum ReviewFault-android-v0.2.1-debug.apk ReviewFault-windows-v0.2.1-x64.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ReviewFault v0.2.1
          body_path: docs/release-v0.2.1.md
          files: |
            ReviewFault-android-v0.2.1-debug.apk
            ReviewFault-windows-v0.2.1-x64.zip
            SHA256SUMS

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: apps/android
      - run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk ReviewFault-android-v0.2.0-debug.apk
          sha256sum ReviewFault-android-v0.2.0-debug.apk > SHA256SUMS-android
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ReviewFault-android-v0.2.0-debug.apk
            SHA256SUMS-android

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild apps/windows/ReviewFault/ReviewFault.csproj -restore -p:Platform=x64 -p:Configuration=Release
      - shell: pwsh
        run: |
          Compress-Archive -Path apps/windows/ReviewFault/bin/x64/Release/* -DestinationPath ReviewFault-windows-v0.2.0-x64.zip
          (Get-FileHash ReviewFault-windows-v0.2.0-x64.zip -Algorithm SHA256).Hash.ToLower() + "  ReviewFault-windows-v0.2.0-x64.zip" | Set-Content SHA256SUMS-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ReviewFault-windows-v0.2.0-x64.zip
            SHA256SUMS-windows

name: verify

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: make test
      - run: dotnet run --project apps/windows/ReviewFault.HeadlessTests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
      - run: >-
          dotnet msbuild apps/windows/ReviewFault/ReviewFault.csproj -t:Compile
          -p:Platform=x64 -p:SkipNativeBuild=true -p:EnableWindowsTargeting=true
          -p:AppxGeneratePriEnabled=false
          -p:AppxGeneratePrisForPortableLibrariesEnabled=false
          -p:AppxGetPackagePropertiesEnabled=false -p:IncludeProjectPriFile=false

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: apps/android

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build apps/windows/ReviewFault/ReviewFault.csproj -p:Platform=x64

# HarmonyOS SDK and signing are installed through DevEco Studio and are not
# redistributable on GitHub-hosted runners. Run the entry module in the
# organization's signed HarmonyOS runner before release.

name: verify

env:
  APP_VERSION: 0.2.2

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: make test
      - run: dotnet run --project apps/windows/ReviewFault.HeadlessTests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
      - run: >-
          dotnet msbuild apps/windows/ReviewFault/ReviewFault.csproj -restore -t:Compile
          -p:Platform=x64 -p:SkipNativeBuild=true -p:EnableWindowsTargeting=true
          -p:AppxGeneratePriEnabled=false
          -p:AppxGeneratePrisForPortableLibrariesEnabled=false
          -p:AppxGetPackagePropertiesEnabled=false -p:IncludeProjectPriFile=false

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint Android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:lintDebug 2>&1 | tee android-build.log
        working-directory: apps/android
      - name: Annotate Android build errors
        if: failure()
        run: |
          grep -E 'requires.*(compileSdk|AGP)|AAR metadata|Dependency |FAILURE:|What went wrong|e: file|error:|Could not resolve|BUILD FAILED' apps/android/android-build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Android build::$line"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReviewFault-android-v${{ env.APP_VERSION }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild apps/windows/ReviewFault/ReviewFault.csproj -restore -p:Platform=x64

# HarmonyOS SDK and signing are installed through DevEco Studio and are not
# redistributable on GitHub-hosted runners. Run the entry module in the
# organization's signed HarmonyOS runner before release.

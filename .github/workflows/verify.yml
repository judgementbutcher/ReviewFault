name: verify

env:
  APP_VERSION: 0.3.1

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: make test
      - run: dotnet run --project apps/windows/ReviewFault.HeadlessTests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
      - run: >-
          dotnet msbuild apps/windows/ReviewFault/ReviewFault.csproj -restore -t:Compile
          -p:Platform=x64 -p:SkipNativeBuild=true -p:EnableWindowsTargeting=true
          -p:AppxGeneratePriEnabled=false
          -p:AppxGeneratePrisForPortableLibrariesEnabled=false
          -p:AppxGetPackagePropertiesEnabled=false -p:IncludeProjectPriFile=false

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint Android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:lintDebug 2>&1 | tee android-build.log
        working-directory: apps/android
      - name: Annotate Android build errors
        if: failure()
        run: |
          grep -E 'requires.*(compileSdk|AGP)|AAR metadata|Dependency |FAILURE:|What went wrong|e: file|error:|Could not resolve|BUILD FAILED' apps/android/android-build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Android build::$line"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReviewFault-android-v${{ env.APP_VERSION }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\publish"
          msbuild apps/windows/ReviewFault/ReviewFault.csproj -restore -t:Publish `
            -p:PublishProfile=win-x64 -p:Configuration=Release -p:Platform=x64 `
            -p:SelfContained=true -p:WindowsAppSDKSelfContained=true `
            -p:PublishDir="$publishDir" 2>&1 | Tee-Object -FilePath windows-publish.log
          $publishExit = $LASTEXITCODE
          if ($publishExit -ne 0) {
            Get-Content windows-publish.log | Select-String -Pattern 'error|failed|exception' |
              ForEach-Object {
                $line = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Windows self-contained publish::$line"
              }
            exit $publishExit
          }
          @("ReviewFault.exe", "reviewfault_core.dll", "Microsoft.WindowsAppRuntime.dll", "Microsoft.ui.xaml.dll") |
            ForEach-Object {
              if (-not (Test-Path (Join-Path $publishDir $_))) {
                Write-Output "::error title=Windows self-contained payload::Missing $_ from $publishDir"
                exit 1
              }
            }
      - name: Build and smoke-test MSI
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\publish"
          $installerDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows\installer"
          dotnet build apps/windows/ReviewFault.Installer/ReviewFault.Installer.wixproj `
            -c Release -p:ProductVersion=$env:APP_VERSION `
            -p:PublishDir="$publishDir" -p:OutputPath="$installerDir" `
            2>&1 | Tee-Object -FilePath windows-msi-build.log
          $msiBuildExit = $LASTEXITCODE
          if ($msiBuildExit -ne 0) {
            Get-Content windows-msi-build.log | Select-String -Pattern 'error|failed|exception|ICE[0-9]+' |
              ForEach-Object {
                $line = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Windows MSI build::$line"
              }
            exit $msiBuildExit
          }
          $msi = Join-Path $installerDir "ReviewFault-windows-v$env:APP_VERSION-x64.msi"
          if (-not (Test-Path $msi)) {
            Write-Output "::error title=Windows MSI build::MSI was not generated: $msi"
            exit 1
          }
          $installLog = Join-Path $env:RUNNER_TEMP "reviewfault-msi-install.log"
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$installLog`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Write-Output "::error title=Windows MSI install::msiexec exited with $($install.ExitCode)"
            Get-Content $installLog
            exit $install.ExitCode
          }
          $installedExe = Join-Path $env:ProgramFiles "ReviewFault\ReviewFault.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Output "::error title=Windows MSI install::Installed executable is missing: $installedExe"
            exit 1
          }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "reviewfault-msi-uninstall.log"
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$uninstallLog`"" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            Write-Output "::error title=Windows MSI uninstall::msiexec exited with $($uninstall.ExitCode)"
            Get-Content $uninstallLog
            exit $uninstall.ExitCode
          }

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewfault
      POSTGRES_USER: reviewfault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U reviewfault -d reviewfault"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-store:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: [object-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10

  sync:
    image: ${SYNC_IMAGE:-reviewfault-sync:0.6.1}
    build:
      context: ..
      dockerfile: services/sync/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Sync: Host=postgres;Database=reviewfault;Username=reviewfault;Password=${POSTGRES_PASSWORD}
      Auth__JwtKey: ${JWT_KEY:?set JWT_KEY}
      Crypto__MasterKeyBase64: ${MASTER_KEY_BASE64:?set MASTER_KEY_BASE64}
      S3__Endpoint: http://object-store:9000
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__Bucket: reviewfault-media
      Smtp__Host: ${SMTP_HOST:?set SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:?set SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM:?set SMTP_FROM}
      Smtp__ActionBaseUrl: https://${SYNC_DOMAIN}/account
      Metrics__Token: ${METRICS_TOKEN:?set METRICS_TOKEN}
    depends_on:
      postgres: { condition: service_healthy }
      object-store: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      sync: { condition: service_healthy }

  backup:
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: reviewfault
      PGUSER: reviewfault
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: ${OFFSITE_RESTIC_REPOSITORY:?set OFFSITE_RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${OFFSITE_RESTIC_PASSWORD:?set OFFSITE_RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY:?set OFFSITE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_KEY:?set OFFSITE_SECRET_KEY}
    volumes:
      - object-data:/object-data:ro
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:
